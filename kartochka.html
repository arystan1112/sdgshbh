<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточка товара</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      background-color: #eef1f6;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #1d2433;
    }

    .card {
      display: flex;
      flex-direction: column;
      width: 320px;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(29, 36, 51, 0.12);
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 34px rgba(29, 36, 51, 0.22);
    }

    .card__image {
      height: 220px;
      background-color: #ffd9a8;
      position: relative;
      overflow: hidden;
    }
    .card__image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .card:hover .card__image img { transform: scale(1.08); }

    .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 4px 12px;
      background-color: #e5484d;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      border-radius: 999px;
    }

    .card__body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
    }
    .card__title { margin: 0; font-size: 22px; }
    .card__text {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: #5a6478;
    }

    .card__footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .price { font-size: 26px; font-weight: bold; }
    .price small {
      display: block;
      font-size: 14px;
      font-weight: normal;
      color: #8a93a6;
      text-decoration: line-through;
    }

    .btn {
      padding: 12px 26px;
      background-color: #3d5afe;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.25s, transform 0.2s, box-shadow 0.25s;
    }
    .btn:hover {
      background-color: #1e3be0;
      transform: scale(1.06);
      box-shadow: 0 6px 14px rgba(61, 90, 254, 0.4);
    }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <article class="card">
    <div class="card__image">
      <span class="badge">-20%</span>
      <img src="OIP.webp" alt="Товар">
    </div>

    <div class="card__body">
      <h2 class="card__title">Название товара</h2>
      <p class="card__text">Краткое описание товара: основные характеристики и преимущества.</p>

      <div class="card__footer">
        <div class="price">
          3 990 ₽
          <small>4 990 ₽</small>
        </div>
        <button class="btn" type="button">Купить</button>
      </div>
    </div>
  </article>

</body>
</html>
